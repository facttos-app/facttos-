<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FACTTOS</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#7B2FF7">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FACTTOS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#F6F0FB;--panel:#fff;--ink:#1E1033;--mute:#7A6C93;--line:#E5D9F2;--me:#7B2FF7;--me-ink:#fff;--them:#fff;--badge:#FF4D8D;--input:#F1EAF9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#150B26;--panel:#1E1236;--ink:#F3ECFF;--mute:#A596C4;--line:#33224F;--me:#9B5CFF;--them:#2A1A47;--input:#2A1A47}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--me);outline-offset:2px}
[hidden]{display:none!important}
.logo{font-weight:800;font-size:30px;letter-spacing:-.05em;line-height:1;padding:2px 4px 6px 0;background:linear-gradient(90deg,var(--me),#FF4D8D);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;display:inline-block}
.logo i{font-style:normal;position:relative;display:inline-block}
.logo i::after{content:"";position:absolute;left:1px;right:3px;bottom:-3px;height:4px;border-radius:2px;background:#FF4D8D}
.auth{display:grid;place-items:center;min-height:100%;padding:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:24px;width:min(400px,100%)}
.card p{color:var(--mute);margin:6px 0 16px}
.field{display:block;width:100%;padding:12px 14px;margin-bottom:10px;border-radius:12px;border:1px solid var(--line);background:var(--input);color:var(--ink);font:inherit}
.send{background:var(--me);color:#fff;border-radius:22px;padding:0 18px;height:44px;font-weight:600}
.full{width:100%;border-radius:12px}
.link{color:var(--me);font-weight:600;margin-top:12px;display:block;width:100%;text-align:center}
.msg{font-size:14px;margin:0 0 10px;color:#D6336C}
.msg.ok{color:#17A398}
.app{display:grid;grid-template-columns:340px 1fr;height:100%;max-width:1100px;margin:0 auto;background:var(--panel)}
.side{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0}
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 8px}
.tools{display:flex;gap:8px}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--input);font-size:19px;line-height:1}
.me-line{padding:0 16px 8px;font-size:13px;color:var(--mute)}
.list{overflow-y:auto;flex:1;min-height:0}
.row{display:flex;gap:12px;align-items:center;width:100%;padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}
.row:hover,.row.on{background:var(--input)}
.av{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px}
.av.g{border-radius:14px}
.meta{flex:1;min-width:0}
.name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.name small{color:var(--mute);font-weight:400;font-size:12px}
.prev{color:var(--mute);font-size:14px;display:flex;justify-content:space-between;gap:8px}
.prev span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--badge);color:#fff;border-radius:10px;font-size:12px;font-weight:800;padding:1px 7px}
.chat{display:flex;flex-direction:column;min-height:0;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line)}
.back{display:none}
.top .t{font-weight:600}.top .s{font-size:13px;color:var(--mute)}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:6px;min-height:0;background:var(--bg)}
.b{max-width:78%;padding:9px 13px;border-radius:18px;background:#fff;color:#1E1033;border:1px solid #E5D9F2;line-height:1.35;overflow-wrap:anywhere;align-self:flex-start;border-bottom-left-radius:5px}
.b.me{align-self:flex-end;background:#7B2FF7;color:#fff;border-color:transparent;border-bottom-left-radius:18px;border-bottom-right-radius:5px}
.b .who{display:block;font-size:12px;font-weight:600;margin-bottom:2px;color:#7B2FF7}
.b time{display:block;font-size:11px;opacity:.6;margin-top:3px;text-align:right}
.b.me{cursor:pointer}
.bar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line);background:var(--panel)}
.bar input{flex:1;min-width:0;padding:12px 16px;border-radius:22px;border:0;background:var(--input);color:var(--ink);font:inherit}
.empty{display:grid;place-items:center;height:100%;color:var(--mute);text-align:center;padding:24px}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--ink);padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:rgba(10,15,35,.5)}
dialog h2{margin:0 0 12px;font-size:20px}
.chk{display:flex;gap:8px;align-items:center;margin:4px 0 12px}
.act{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
@media (max-width:720px){
.app{grid-template-columns:1fr}
.chat{display:none}
.app.open .side{display:none}.app.open .chat{display:flex}
.back{display:grid}
.b{max-width:86%}
}
</style>
</head>
<body>

<section class="auth" id="auth" hidden>
  <div class="card">
    <div class="logo" aria-label="FACTTOS">FAC<i>TT</i>OS</div>
    <p id="sub">Connecte-toi pour retrouver tes conversations.</p>
    <form id="af">
      <input class="field" id="an" placeholder="Ton prénom ou pseudo" maxlength="30" autocomplete="nickname" hidden>
      <input class="field" id="ae" type="email" placeholder="Adresse e-mail" required autocomplete="email">
      <input class="field" id="ap" type="password" placeholder="Mot de passe (6 caractères minimum)" required minlength="6" autocomplete="current-password">
      <p class="msg" id="am" hidden></p>
      <button class="send full" id="ab" type="submit">Se connecter</button>
    </form>
    <button class="link" id="at" type="button">Pas de compte ? Créer un compte</button>
  </div>
</section>

<div class="app" id="app" hidden>
  <aside class="side">
    <div class="brand"><div class="logo" aria-label="FACTTOS">FAC<i>TT</i>OS</div>
      <div class="tools"><button class="icon-btn" id="new" aria-label="Nouvelle conversation">＋</button><button class="icon-btn" id="out" aria-label="Se déconnecter">⎋</button></div></div>
    <div class="me-line" id="who"></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="chat" id="chat"></main>
</div>

<dialog id="dlg">
  <form method="dialog" id="f">
    <h2>Nouvelle conversation</h2>
    <input class="field" id="ne" placeholder="E-mail du contact (plusieurs : séparés par une virgule)" required autocomplete="off">
    <div class="chk"><input type="checkbox" id="ng"><label for="ng">C'est un groupe</label></div>
    <input class="field" id="ngn" placeholder="Nom du groupe" maxlength="30" hidden>
    <p class="msg" id="nm" hidden></p>
    <div class="act"><button type="button" id="cancel" style="padding:10px 14px">Annuler</button><button class="send" type="submit">Créer</button></div>
  </form>
</dialog>

<dialog id="md">
  <form id="mf">
    <h2>Ton message</h2>
    <input class="field" id="etx" maxlength="2000" autocomplete="off" aria-label="Modifier le message">
    <p class="msg" id="em" hidden></p>
    <div class="act"><button type="button" id="ecan" style="padding:10px 14px">Annuler</button><button type="button" id="edel" style="padding:10px 14px;color:#D6336C;font-weight:600">Supprimer</button><button class="send" type="submit">Enregistrer</button></div>
  </form>
</dialog>

<script>
(function(){
var SB_URL="https://eduqrmfgbrssihoglunw.supabase.co";
var SB_KEY="sb_publishable_oQ0OYehrx485wazISydORQ__BGD3iXV";
var sb=supabase.createClient(SB_URL,SB_KEY);
var COLORS=["#7B2FF7","#E8387A","#0EA5A4","#F59E0B","#2563EB","#16A34A","#EA580C","#DB2777"];
function hash(s){var h=0;s=String(s);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h}
var me=null,convs=[],cur=null,msgs={},names={},signup=false,chan=null;
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function hm(t){return new Date(t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})}
function day(t){var d=new Date(t);return d.toDateString()==new Date().toDateString()?hm(t):d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"})}
function say(el,t,ok){el.hidden=!t;el.textContent=t||"";el.className="msg"+(ok?" ok":"")}
function title(c){if(c.group)return c.name||"Groupe";var o=c.members.filter(function(u){return u!==me.id})[0];return names[o]||"Contact"}
function avatar(c){return '<span class="av'+(c.group?' g':'')+'" style="background:'+COLORS[hash(title(c))%COLORS.length]+'">'+esc(title(c).charAt(0).toUpperCase())+'</span>'}

/* ---- Connexion / inscription ---- */
function mode(s){signup=s;$("an").hidden=!s;$("an").required=s;$("ab").textContent=s?"Créer mon compte":"Se connecter";$("at").textContent=s?"Déjà un compte ? Se connecter":"Pas de compte ? Créer un compte";$("sub").textContent=s?"Crée ton compte FACTTOS en quelques secondes.":"Connecte-toi pour retrouver tes conversations.";$("ap").autocomplete=s?"new-password":"current-password";say($("am"),"")}
$("at").onclick=function(){mode(!signup)};
$("af").onsubmit=async function(e){
  e.preventDefault();say($("am"),"");$("ab").disabled=true;
  var em=$("ae").value.trim(),pw=$("ap").value,r;
  if(signup)r=await sb.auth.signUp({email:em,password:pw,options:{data:{name:$("an").value.trim()}}});
  else r=await sb.auth.signInWithPassword({email:em,password:pw});
  $("ab").disabled=false;
  if(r.error){say($("am"),r.error.message.indexOf("Invalid login")>=0?"E-mail ou mot de passe incorrect.":r.error.message);return}
  if(signup&&!r.data.session){say($("am"),"Compte créé. Vérifie ta boîte mail pour confirmer, puis connecte-toi.",true);return}
  if(r.data.session)start(r.data.session.user);
};
$("out").onclick=async function(){await sb.auth.signOut();location.reload()};

async function start(user){
  me=user;$("auth").hidden=true;$("app").hidden=false;
  $("who").textContent="Connecté : "+(user.user_metadata&&user.user_metadata.name||user.email);
  await loadConvs();renderChat();listen();
}

/* ---- Données ---- */
async function loadConvs(){
  var r=await sb.from("members").select("conversation_id, conversations(id,name,is_group,created_at)").eq("user_id",me.id);
  var rows=(r.data||[]).filter(function(x){return x.conversations});
  var ids=rows.map(function(x){return x.conversation_id});
  if(!ids.length){convs=[];renderList();return}
  var all=(await sb.from("members").select("conversation_id,user_id").in("conversation_id",ids)).data||[];
  var uids=[];all.forEach(function(m){if(uids.indexOf(m.user_id)<0)uids.push(m.user_id)});
  var ps=(await sb.from("profiles").select("id,name").in("id",uids)).data||[];
  ps.forEach(function(p){names[p.id]=p.name});
  var ms=(await sb.from("messages").select("*").in("conversation_id",ids).order("created_at",{ascending:false}).limit(300)).data||[];
  var old={};convs.forEach(function(c){old[c.id]=c.unread});
  convs=rows.map(function(x,i){
    var c=x.conversations;
    return{id:c.id,name:c.name,group:c.is_group,idx:i,unread:old[c.id]||0,
      members:all.filter(function(m){return m.conversation_id==c.id}).map(function(m){return m.user_id}),
      last:ms.filter(function(m){return m.conversation_id==c.id})[0]||null,created:c.created_at};
  });
  renderList();
}
function renderList(){
  var h="";
  convs.slice().sort(function(a,b){return new Date(b.last?b.last.created_at:b.created)-new Date(a.last?a.last.created_at:a.created)}).forEach(function(c){
    var l=c.last,p=l?((l.sender_id==me.id?"Vous : ":(c.group?(names[l.sender_id]||"?")+" : ":""))+l.body):"Aucun message";
    h+='<button class="row'+(cur===c.id?' on':'')+'" data-id="'+c.id+'">'+avatar(c)+'<span class="meta"><span class="name"><span>'+esc(title(c))+'</span><small>'+(l?day(l.created_at):'')+'</small></span><span class="prev"><span>'+esc(p)+'</span>'+(c.unread?'<span class="badge">'+c.unread+'</span>':'')+'</span></span></button>';
  });
  $("list").innerHTML=h||'<div class="empty">Aucune conversation.<br>Appuie sur ＋ pour écrire à quelqu\'un.</div>';
}
function renderChat(){
  var c=convs.filter(function(x){return x.id===cur})[0];
  if(!c){$("chat").innerHTML='<div class="empty">Choisis une conversation<br>ou crée-en une avec ＋</div>';return}
  var prev=$("txt"),keep=(prev&&renderedFor===c.id)?prev.value:"",had=prev&&document.activeElement===prev;
  var h='<div class="top"><button class="icon-btn back" id="back" aria-label="Retour">←</button>'+avatar(c)+'<div><div class="t">'+esc(title(c))+'</div><div class="s">'+(c.group?c.members.length+' participants':'Conversation privée')+'</div></div></div><div class="msgs" id="msgs">';
  var list=msgs[c.id]||[];
  if(!list.length)h+='<div class="empty">Dis bonjour 👋</div>';
  list.forEach(function(m){
    var mine=m.sender_id==me.id;
    h+='<div class="b'+(mine?' me':'')+'" data-id="'+m.id+'">'+(c.group&&!mine?'<span class="who">'+esc(names[m.sender_id]||"?")+'</span>':'')+esc(m.body)+'<time>'+(m.edited_at?'modifié · ':'')+hm(m.created_at)+'</time></div>';
  });
  h+='</div><form class="bar" id="bar"><input type="text" id="txt" placeholder="Écrire un message" autocomplete="off" aria-label="Message"><button class="send" type="submit">Envoyer</button></form>';
  $("chat").innerHTML=h;renderedFor=c.id;$("txt").value=keep;if(had)$("txt").focus();
  var box=$("msgs");box.scrollTop=box.scrollHeight;
  box.onclick=function(e){var b=e.target.closest(".b.me");if(b)openEdit(b.dataset.id)};
  $("back").onclick=function(){cur=null;$("app").classList.remove("open");renderList();renderChat()};
  $("bar").onsubmit=async function(e){
    e.preventDefault();var v=$("txt").value.trim();if(!v)return;$("txt").value="";
    var r=await sb.from("messages").insert({conversation_id:c.id,body:v}).select().single();
    if(r.error){alert("Message non envoyé : "+r.error.message);return}
    add(r.data);
  };
}
function add(m){
  var list=msgs[m.conversation_id]=msgs[m.conversation_id]||[];
  if(list.some(function(x){return x.id==m.id}))return;
  list.push(m);
  var c=convs.filter(function(x){return x.id===m.conversation_id})[0];
  if(c){c.last=m;if(cur!==c.id&&m.sender_id!==me.id)c.unread++}
  renderList();if(cur===m.conversation_id)renderChat();
}
async function open(id){
  cur=id;var c=convs.filter(function(x){return x.id===id})[0];if(c)c.unread=0;
  $("app").classList.add("open");renderList();
  var r=await sb.from("messages").select("*").eq("conversation_id",id).order("created_at").limit(200);
  msgs[id]=r.data||[];renderChat();
}
var editing=null,renderedFor=null;
function findMsg(id){for(var k in msgs){var l=msgs[k];for(var i=0;i<l.length;i++)if(l[i].id==id)return l[i]}return null}
function openEdit(id){var m=findMsg(id);if(!m)return;editing=m;$("etx").value=m.body;say($("em"),"");$("md").showModal()}
function applyUpdate(n){
  var m=findMsg(n.id);if(!m)return;
  m.body=n.body;m.edited_at=n.edited_at;
  renderList();renderChat();
}
function applyDelete(id){
  var hit=false;
  for(var k in msgs){var b=msgs[k].length;msgs[k]=msgs[k].filter(function(x){return x.id!=id});if(msgs[k].length!==b)hit=true}
  if(hit)loadConvs().then(renderChat);
}
$("mf").onsubmit=async function(e){
  e.preventDefault();if(!editing)return;
  var v=$("etx").value.trim();
  if(!v){say($("em"),"Le message ne peut pas être vide. Utilise « Supprimer » pour le retirer.");return}
  if(v===editing.body){$("md").close();return}
  var r=await sb.from("messages").update({body:v,edited_at:new Date().toISOString()}).eq("id",editing.id).select().single();
  if(r.error){say($("em"),r.error.message);return}
  $("md").close();applyUpdate(r.data);
};
$("edel").onclick=async function(){
  if(!editing||!confirm("Supprimer ce message pour tout le monde ?"))return;
  var r=await sb.from("messages").delete().eq("id",editing.id).select();
  if(r.error||!r.data||!r.data.length){say($("em"),r.error?r.error.message:"Suppression impossible.");return}
  $("md").close();applyDelete(editing.id);
};
$("ecan").onclick=function(){$("md").close()};
function listen(){
  if(chan)return;
  chan=sb.channel("facttos-messages").on("postgres_changes",{event:"INSERT",schema:"public",table:"messages"},async function(p){
    var m=p.new;
    if(!convs.some(function(c){return c.id===m.conversation_id}))await loadConvs();
    if(!names[m.sender_id]){var q=await sb.from("profiles").select("id,name").eq("id",m.sender_id).single();if(q.data)names[q.data.id]=q.data.name}
    add(m);
  }).on("postgres_changes",{event:"UPDATE",schema:"public",table:"messages"},function(p){applyUpdate(p.new)
  }).on("postgres_changes",{event:"DELETE",schema:"public",table:"messages"},function(p){applyDelete(p.old.id)}).subscribe();
}
$("list").onclick=function(e){var b=e.target.closest(".row");if(b)open(b.dataset.id)};

/* ---- Nouvelle conversation ---- */
$("new").onclick=function(){$("ne").value="";$("ng").checked=false;$("ngn").value="";$("ngn").hidden=true;say($("nm"),"");$("dlg").showModal()};
$("cancel").onclick=function(){$("dlg").close()};
$("ng").onchange=function(){$("ngn").hidden=!this.checked};
$("f").onsubmit=async function(e){
  e.preventDefault();say($("nm"),"");
  var emails=$("ne").value.split(",").map(function(s){return s.trim().toLowerCase()}).filter(Boolean);
  var group=$("ng").checked;
  if(!group&&emails.length>1){say($("nm"),"Coche « groupe » pour écrire à plusieurs personnes.");return}
  var ps=(await sb.from("profiles").select("id,name,email").in("email",emails)).data||[];
  var found=ps.map(function(p){return p.email});
  var miss=emails.filter(function(x){return found.indexOf(x)<0});
  if(miss.length){say($("nm"),"Aucun compte FACTTOS pour : "+miss.join(", ")+". Invite cette personne à s'inscrire.");return}
  if(ps.some(function(p){return p.id===me.id})){say($("nm"),"Tu ne peux pas t'ajouter toi-même.");return}
  ps.forEach(function(p){names[p.id]=p.name});
  if(!group){
    var ex=convs.filter(function(c){return !c.group&&c.members.indexOf(ps[0].id)>=0})[0];
    if(ex){$("dlg").close();open(ex.id);return}
  }
  var gn=$("ngn").value.trim();
  if(group&&!gn){say($("nm"),"Donne un nom au groupe.");return}
  var c=await sb.from("conversations").insert({name:group?gn:null,is_group:group}).select().single();
  if(c.error){say($("nm"),c.error.message);return}
  var mem=[{conversation_id:c.data.id,user_id:me.id}].concat(ps.map(function(p){return{conversation_id:c.data.id,user_id:p.id}}));
  var r=await sb.from("members").insert(mem);
  if(r.error){say($("nm"),r.error.message);return}
  $("dlg").close();await loadConvs();open(c.data.id);
};

if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}

/* ---- Démarrage ---- */
sb.auth.getSession().then(function(r){
  if(r.data.session)start(r.data.session.user);else $("auth").hidden=false;
});
})();
</script>
</body>
</html>
